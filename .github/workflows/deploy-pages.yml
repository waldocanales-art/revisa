name: Publicar REVISa V17 en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener version aprobada
        uses: actions/checkout@v4
      - name: Validar archivos de REVISa
        run: |
          test -s index.html
          test -s config.js
          test -s index-xY6Lk_ls.js
          node --check config.js
          node --check index-xY6Lk_ls.js
          grep -q 'REVISa-V17-2026-10-15' config.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación estática
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar versión validada
        id: deployment
        uses: actions/deploy-pages@v4
