name: Auditor UA connection checks
on:
  push:
    branches: [reparacion-parafraseador-2026-10-12]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of secure API connector
        run: node --check config.js
      - name: Validate expected historical assets
        run: |
          test -s index.html
          test -s index-xY6Lk_ls.js
          test -s index-CMfRaoDI.css
          grep -q 'v1/audit/' config.js
          grep -q 'X-API-Key' config.js

      - name: Verify passwordless Parafraseador
        run: |
          test -s parafraseador-directo-20261012.html
          grep -q '/v1/paraphrase' parafraseador-directo-20261012.html
          if grep -Eq 'X-API-Key|id="password"|app.n8n.cloud' parafraseador-directo-20261012.html; then
            echo "Parafraseador still contains old key or n8n route"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current=False
                  self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script":
                      self.current=True
                      self.items.append("")
              def handle_endtag(self,tag):
                  if tag=="script":
                      self.current=False
              def handle_data(self,data):
                  if self.current:
                      self.items[-1]+=data
          reader=Scripts()
          reader.feed(Path("parafraseador-directo-20261012.html").read_text())
          assert reader.items
          Path("/tmp/para-sin-clave.js").write_text(reader.items[0])
          config=Path("config.js").read_text()
          start=config.index("async function paraphraseViaRender(")
          stop=config.index("async function callLegacyService(",start)
          assert "accessKey()" not in config[start:stop]
          assert '"X-API-Key": key' not in config[start:stop]
          PY
          node --check /tmp/para-sin-clave.js

      - name: Verify V3 integrity checklist and direct client
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          txt=Path("parafraseador-sin-clave.html").read_text()
          assert txt.count('data-protect value=') == 11
          assert 'name="password"' not in txt and 'X-API-Key' not in txt
          assert 'data.append("protecciones"' in txt
          assert 'data.append("terminos_protegidos"' in txt
          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.using=False
                  self.source=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script":
                      self.using=True
                      self.source.append("")
              def handle_endtag(self,tag):
                  if tag=="script":
                      self.using=False
              def handle_data(self,data):
                  if self.using:
                      self.source[-1] += data
          parser=Collector()
          parser.feed(txt)
          Path("/tmp/parafraseador-v3.js").write_text("\n".join(parser.source))
          PY
          node --check /tmp/parafraseador-v3.js

      - name: Validate semantic V4 UI
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          content = Path("parafraseador-sin-clave.html").read_text()
          for required in (
              'value="semantico"', 'value="conservador"',
              'id="externalConsent"', 'id="consent"',
              'data.append("modo"', 'data.append("consentimiento_ia"',
              '/v1/paraphrase/capabilities',
          ):
              assert required in content, required
          assert 'id="password"' not in content
          assert content.count('data-protect value=') == 11
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="script":
                      self.active=True
                      self.parts.append("")
              def handle_endtag(self, tag):
                  if tag=="script":
                      self.active=False
              def handle_data(self, value):
                  if self.active:
                      self.parts[-1]+=value
          parser=Scripts()
          parser.feed(content)
          assert parser.parts
          Path("/tmp/parafraseador-v4.js").write_text("\n".join(parser.parts))
          PY
          node --check /tmp/parafraseador-v4.js
