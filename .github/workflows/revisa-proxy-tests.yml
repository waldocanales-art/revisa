name: REVISA proxy routing tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/config-routing.test.cjs
