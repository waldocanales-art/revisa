    <script>
      document.addEventListener("click", function(event) {
        const target = event.target;
        const button = target && target.closest && target.closest("button, [role='tab']");
        if (!button) return;
        const label = (button.textContent || "").trim().toLowerCase();
        if (!label.includes("parafraseador")) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign("./parafraseador-v6.html");
      }, true);
